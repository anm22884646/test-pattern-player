<!doctype html><html lang="ja"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src pattern:; connect-src 'self' pattern:"><title>Pattern Player</title><link rel="stylesheet" href="style.css">
<body><main><header><div><h1>PATTERN PLAYER</h1><p>LED Processorへのクリーン出力 · macOS</p></div><button id="open" class="accent">動画を開く</button></header>
<section><div class="row"><span>出力画面</span><div id="screens" class="wrap"></div><button id="fullscreen">全画面</button></div><p id="screenInfo"></p></section>
<section><h2>内蔵テストパターン</h2><div id="patterns" class="wrap"></div></section>
<section><div class="row"><h2 id="file">動画が読み込まれていません</h2><span id="state">待機中</span></div><div class="row timeline"><span id="current">00:00</span><input id="timeline" type="range" min="0" max="1" step="0.01" value="0" disabled aria-label="再生位置"><span id="duration">00:00</span></div><div class="row playback"><button id="play" disabled>▶ 再生</button><button id="pause" disabled>Ⅱ 一時停止</button><label><input id="loop" type="checkbox" checked> Loop</label></div>
<label class="audioCheck"><input id="audioCheck" type="checkbox"> Audio Check</label><div class="row"><label for="audioOutput">音声出力</label><select id="audioOutput"><option value="">macOS の既定の出力</option></select><button id="refresh">更新</button></div><p>HDMI / DisplayPort の音声デバイスを選択してください</p><p id="audioStatus" role="status"></p><audio id="audio" loop preload="auto"></audio></section>
<footer><span id="status" role="status">内蔵パターンまたはMP4 / MOVを選択してください</span><p>Space: 再生／一時停止　 F11: 全画面　 Esc: 全画面を終了</p></footer></main><script src="control.js"></script></body></html>
